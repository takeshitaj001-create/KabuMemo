name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/KabuMemo/" />|g' wwwroot/index.html

      - name: Publish
        run: dotnet publish -c Release

      - name: Copy index.html to 404.html
        run: |
          cp bin/Release/net10.0/publish/wwwroot/index.html \
             bin/Release/net10.0/publish/wwwroot/404.html

      - name: Deploy to master/docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bin/Release/net10.0/publish/wwwroot
          publish_branch: master
          destination_dir: docs
          force_orphan: false
