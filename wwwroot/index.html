<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KabuMemo</title>
  <base href="/" />
  <link rel="preload" id="webassembly" />
  <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="KabuMemo.styles.css" rel="stylesheet" />
  <script type="importmap"></script>
</head>

<body>
  <div id="app">
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
      <img class="loading-img-pc" src="gif/loading-cat.png" alt="読み込み中" />
      <img class="loading-img-mobile" src="gif/loading-mobile.gif" alt="読み込み中" />
    </div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
  </div>
  <script>
    // 404.html からリダイレクトされた場合に元の URL を復元する
    // 例: /KabuMemo/?p=stock/7203 → /KabuMemo/stock/7203
    (function () {
      var params = new URLSearchParams(window.location.search);
      var path = params.get('p');
      if (path) {
        var query = params.get('q') ? '?' + params.get('q') : '';
        window.history.replaceState(
          null, null,
          window.location.pathname + path + query + window.location.hash
        );
      }
    })();
  </script>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
