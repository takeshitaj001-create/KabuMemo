<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KabuMemo</title>
  <script>
    // GitHub Pages SPA ルーティング対策
    // 404 発生時に現在の URL をクエリパラメータに変換してトップページへリダイレクトする
    var segmentsToKeep = 1; // "/KabuMemo" の階層数
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/') +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
