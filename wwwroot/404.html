<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KabuMemo</title>
  <script>
    // GitHub Pages SPA ルーティング対策
    // 例: /KabuMemo/stock/7203 → /KabuMemo/?p=stock/7203
    var l = window.location;
    var segments = l.pathname.split('/').filter(Boolean); // ["KabuMemo","stock","7203"]
    var base = '/' + segments[0] + '/';                  // "/KabuMemo/"
    var path = segments.slice(1).join('/');              // "stock/7203"
    l.replace(
      base + '?p=' + path +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
